name = "alphie-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

# Non-secret settings. Secrets are set with `wrangler secret put`:
#   OPENAI_API_KEY      (required)
#   AZURE_SPEECH_KEY    (optional, enables Azure Neural voices)
#   API_SECRET          (optional, must match VITE_API_SECRET on Vercel)
[vars]
AZURE_SPEECH_REGION = "francecentral"
ALLOWED_ORIGINS = "https://ai-reader-phi.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
# TTS_MODEL = "gpt-4o-mini-tts"

# Per-IP rate limits (period must be 10 or 60 seconds).
[[ratelimits]]
name = "TTS_LIMITER"
namespace_id = "1001"
simple = { limit = 200, period = 60 }

[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
